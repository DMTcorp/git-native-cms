name: CMS scheduled publication
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
concurrency:
  group: cms-publish-production
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cms publish --environment production --idempotency-key schedule-${{ github.run_id }}-${{ github.run_attempt }}
